[package]
name = "alsa-playback-monitor"
version = "0.1.0"
edition = "2024"
description = "Report when ALSA playback starts and stops, driven by inotify"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
nix = { version = "0.31.3", features = ["inotify", "poll"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
